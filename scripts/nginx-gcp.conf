# ==============================================================================
# 智学大脑 (StudyBrain) - Google Cloud VM Nginx 生产环境配置
#
# 使用指南:
# 1. 将前端打包产物上传至服务器: /var/www/study-brain/dist
# 2. 将本文件复制至: /etc/nginx/conf.d/study-brain.conf (或 /etc/nginx/sites-available/)
# 3. 运行 nginx -t 检查配置，通过后运行 systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    server_name _; # 请将此处替换为您的域名，如 study.yourdomain.com 或云服务器公网 IP

    # 静态文件根目录
    root /var/www/study-brain/dist;
    index index.html;

    # 启用 Gzip 深度压缩，提升静态资源与学科 JSON 传输性能
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # 1. 坚果云 WebDAV 跨域反向代理 (解决浏览器端跨域限制)
    location /api/nutstore/ {
        proxy_pass https://dav.jianguoyun.com/dav/;
        proxy_ssl_server_name on;
        proxy_set_header Host dav.jianguoyun.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 跨域响应头设置
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PROPFIND, MKCOL, MOVE, COPY' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Depth, If-Match, If-None-Match' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # 2. 公共学科数据 (content/*.json) 协商缓存，确保新版大纲即时更新
    location /content/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 3. 静态构建静态资源 (JS/CSS/字体/图片) 长期强缓存
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 4. 单页应用 SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
