# ==============================================================================
# 智学大脑 (Study Brain) - Ubuntu 生产环境 Nginx 纯静态高性能配置
#
# 使用指南:
# 1. 创建静态网页目录: sudo mkdir -p /var/www/study-brain/dist
# 2. 将本文件复制至: sudo cp scripts/nginx-ubuntu.conf /etc/nginx/sites-available/study-brain.conf
# 3. 启用站点: sudo ln -s /etc/nginx/sites-available/study-brain.conf /etc/nginx/sites-enabled/
# 4. 测试并重载: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    server_name _; # 请替换为您的域名 (例如 study.example.com) 或云服务器公网 IP

    # 静态文件根目录 (纯静态单页架构，零 Node 进程开销)
    root /var/www/study-brain/dist;
    index index.html;

    # 开启 Gzip 深度压缩，大幅提升学科考点 JSON 与静态资源传输速度
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # 1. 坚果云 WebDAV 跨域反向代理 (解决浏览器端跨域限制)
    location /api/nutstore/ {
        proxy_pass https://dav.jianguoyun.com/dav/;
        proxy_ssl_server_name on;
        proxy_set_header Host dav.jianguoyun.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 跨域响应头设置
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PROPFIND, MKCOL, MOVE, COPY' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Depth, If-Match, If-None-Match' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # 2. 公共学科数据 (content/*.json) 协商缓存，确保题库即时更新
    location /content/ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 3. 静态前端资源 (JS/CSS/字体/图片/音频) 长期强缓存
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 4. 单页应用 (SPA) Hash 路由及兜底保障
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
